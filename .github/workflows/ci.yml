name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Demo simulation smoke test
        run: synapse-realworld demo --population 50 --seed 42 > /tmp/synapse-demo.json
      - name: Synthetic-market end-to-end smoke test
        run: |
          DB=/tmp/synapse-realworld-ci.duckdb
          REGISTRY=/tmp/synapse-model-registry
          POPULATION=/tmp/population-profile.json
          CALIBRATION=/tmp/calibration.json
          UNCERTAINTY=/tmp/uncertainty.json

          synapse-realworld init-store --db "$DB"
          synapse-realworld ingest-sales examples/data/laa_sales_capture_sample.csv --db "$DB"
          synapse-realworld ingest-outcomes examples/data/laa_outcomes_sample.csv --db "$DB"
          synapse-realworld ingest-inventory \
            --units-csv examples/data/laa_unit_versions_sample.csv \
            --offers-csv examples/data/laa_offers_sample.csv \
            --db "$DB"
          synapse-realworld store-stats --db "$DB" > /tmp/store-stats.json

          synapse-realworld fit-population \
            --db "$DB" \
            --profile-name laa-ci-v0.4 \
            --diagnostic-population-size 500 \
            --output "$POPULATION" > /tmp/population-console.json
          test -s "$POPULATION"

          synapse-realworld calibrate \
            --units-csv examples/data/laa_unit_versions_sample.csv \
            --offers-csv examples/data/laa_offers_sample.csv \
            --travel-times-csv examples/data/laa_travel_times_sample.csv \
            --project-anchor-id LAA \
            --db "$DB" \
            --registry-dir "$REGISTRY" \
            --model-version v0.4-ci \
            --code-commit-sha "$GITHUB_SHA" \
            --holdout-fraction 0.5 \
            --bootstrap-samples 5 \
            --output "$CALIBRATION" > /tmp/calibration-console.json
          test -s "$CALIBRATION"

          ARTIFACT_ID=$(python -c 'import json; print(json.load(open("/tmp/calibration.json"))["artifact"]["artifact_id"])')
          synapse-realworld model-decide "$ARTIFACT_ID" \
            --status validated \
            --decided-by ci-data-review \
            --reason "CI holdout validation" \
            --registry-dir "$REGISTRY" > /tmp/model-validated.json
          synapse-realworld model-decide "$ARTIFACT_ID" \
            --status approved \
            --decided-by ci-business-review \
            --reason "CI approval lifecycle test" \
            --registry-dir "$REGISTRY" > /tmp/model-approved.json

          synapse-realworld simulate-uncertainty "$ARTIFACT_ID" \
            --population-profile "$POPULATION" \
            --units-csv examples/data/laa_unit_versions_sample.csv \
            --offers-csv examples/data/laa_offers_sample.csv \
            --as-of 2026-09-15T08:00:00+07:00 \
            --travel-times-csv examples/data/laa_travel_times_sample.csv \
            --project-anchor-id LAA \
            --registry-dir "$REGISTRY" \
            --scenario-id ci-price-plus-5 \
            --price-change 0.05 \
            --population-size 100 \
            --output "$UNCERTAINTY" > /tmp/uncertainty-console.json
          test -s "$UNCERTAINTY"

          synapse-realworld models --registry-dir "$REGISTRY" > /tmp/models.json
          python - <<'PY'
          import json
          models = json.load(open("/tmp/models.json"))
          result = json.load(open("/tmp/uncertainty.json"))
          u = result["uncertainty"]
          assert models[0]["status"] == "approved"
          assert u["model_status"] == "approved"
          assert u["laa_share"]["p05"] <= u["laa_share"]["p50"] <= u["laa_share"]["p95"]
          assert u["population_version"].startswith("empirical:laa-ci-v0.4:")
          PY
