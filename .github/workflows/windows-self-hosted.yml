name: windows-self-hosted

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: Synapse local test mode
        required: true
        default: full
        type: choice
        options:
          - quick
          - unit
          - milestones
          - productionization
          - full
  push:
    branches:
      - main

concurrency:
  group: synapse-realworld-windows
  cancel-in-progress: false

jobs:
  local-validation:
    runs-on: [self-hosted, Windows, X64, github_reel_review]
    timeout-minutes: 60
    env:
      SYNAPSE_LOCAL_REPO: 'C:\Users\vulem\OneDrive\Documents\ChatGPT\Kabin Toolkit Test\synapse-realworld'

    steps:
      - name: Checkout exact commit in runner workspace
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Show runner checkout identity
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Runner workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Canonical local repo: $env:SYNAPSE_LOCAL_REPO"
          git rev-parse HEAD
          git status --short

      - name: Sync canonical local repo on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $target = $env:SYNAPSE_LOCAL_REPO
          $parent = Split-Path -Parent $target
          New-Item -ItemType Directory -Force -Path $parent | Out-Null

          if (-not (Test-Path $target)) {
            Write-Host "Cloning Synapse into canonical local repo: $target"
            git clone "https://github.com/${{ github.repository }}.git" "$target"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone Synapse into canonical local repo."
            }
          } elseif (-not (Test-Path (Join-Path $target ".git"))) {
            $existing = @(Get-ChildItem -Force -Path $target -ErrorAction SilentlyContinue)
            if ($existing.Count -gt 0) {
              throw "Canonical local repo path exists but is not a Git repository: $target"
            }
            git clone "https://github.com/${{ github.repository }}.git" "$target"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone Synapse into empty canonical local repo path."
            }
          }

          Set-Location $target

          $dirty = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect canonical local repository status."
          }
          if ($dirty.Count -gt 0) {
            Write-Host "Local changes detected. Synapse will not overwrite them:"
            $dirty | ForEach-Object { Write-Host $_ }
            throw "Canonical local repo has uncommitted/untracked changes. Commit, stash, or remove them before automatic sync."
          }

          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to configure origin for canonical local repo."
          }

          git fetch origin main --prune
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch origin/main."
          }

          git switch main
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to switch canonical local repo to main."
          }

          git merge --ff-only origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical local main cannot fast-forward cleanly to origin/main."
          }

          $localSha = (git rev-parse HEAD).Trim()
          Write-Host "Canonical local SHA: $localSha"
          Write-Host "GitHub workflow SHA: ${{ github.sha }}"
          if ($localSha -ne "${{ github.sha }}") {
            throw "Canonical local repo HEAD does not match the GitHub commit being validated."
          }

          "SYNAPSE_TEST_ROOT=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Use runner workspace for manual branch validation
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          Write-Host "Manual dispatch does not modify the canonical working repo."
          Write-Host "Testing selected GitHub ref in runner workspace: $env:GITHUB_WORKSPACE"
          "SYNAPSE_TEST_ROOT=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Synapse through repository helper
        shell: powershell
        run: |
          Set-Location $env:SYNAPSE_TEST_ROOT
          Write-Host "Setup root: $env:SYNAPSE_TEST_ROOT"
          powershell -ExecutionPolicy Bypass -File .\scripts\setup.ps1

      - name: Run requested local test mode
        shell: powershell
        run: |
          Set-Location $env:SYNAPSE_TEST_ROOT
          $mode = "${{ github.event.inputs.test_mode }}"
          if ([string]::IsNullOrWhiteSpace($mode)) {
            $mode = "full"
          }
          Write-Host "Test root: $env:SYNAPSE_TEST_ROOT"
          Write-Host "Running Synapse test mode: $mode"
          .\scripts\test.ps1 -Mode $mode

      - name: Show installed source identity
        if: always()
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNAPSE_TEST_ROOT)) {
            Write-Host "SYNAPSE_TEST_ROOT was not set."
            exit 0
          }
          Set-Location $env:SYNAPSE_TEST_ROOT
          if (Test-Path ".\.venv\Scripts\python.exe") {
            .\.venv\Scripts\python.exe -c "import synapse_realworld; print('version=' + synapse_realworld.__version__); print('module=' + synapse_realworld.__file__)"
          }
          Write-Host "Validated root: $env:SYNAPSE_TEST_ROOT"
          git rev-parse --short HEAD
